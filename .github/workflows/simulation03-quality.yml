name: simulation03-quality

on:
  pull_request:
    paths:
      - "training_extension/**"
      - ".github/workflows/simulation03-quality.yml"
  push:
    branches:
      - "feature/simulation03-derived-baseline"
      - "feature/simulation03-cem"
    paths:
      - "training_extension/**"
      - ".github/workflows/simulation03-quality.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s training_extension/tests -v
      - run: python -m training_extension.quality_check --smoke-episodes 2
